name: NodeShiftMusic
options:
  bundleIdPrefix: space.nodeshift
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
packages:
  NSMCore:
    path: Packages/NSMCore
  SFBAudioEngine:
    url: https://github.com/sbooth/SFBAudioEngine
    exactVersion: 0.14.0
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.20
  SWCompression:
    url: https://github.com/tsolomko/SWCompression
    exactVersion: 4.9.1
targets:
  NodeShiftMusic:
    type: application
    platform: iOS
    sources:
      - path: NodeShiftMusic
      - path: ../shared/fonts
    dependencies:
      - package: NSMCore
      - package: SFBAudioEngine
      - package: GRDB
      - package: ZIPFoundation
      - package: SWCompression
      - framework: Vendor/discord/ios/discord_partner_sdk.xcframework
        embed: true
      - framework: Vendor/discord/ios/discord_partner_sdk_krisp.xcframework
        embed: true
    info:
      path: NodeShiftMusic/Info.plist
      properties:
        CFBundleDisplayName: NS Music
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: Камера нужна, чтобы сканировать QR-код комнаты «Слушать вместе»
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.mp3
              - public.mpeg-4-audio
              - org.xiph.flac
              - com.microsoft.waveform-audio
              - public.zip-archive
        CADisableMinimumFrameDurationOnPhone: true
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Unbounded-Medium.ttf
          - Unbounded-SemiBold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
        CFBundleURLTypes:
          - CFBundleURLName: space.nodeshift.music
            CFBundleURLSchemes:
              - space.nodeshift.music
          - CFBundleURLName: space.nodeshift.music.discord
            CFBundleURLSchemes:
              - discord-1498024819675889704
        LSApplicationQueriesSchemes:
          - discord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.nodeshift.music
        PRODUCT_NAME: NodeShiftMusic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SWIFT_OBJC_BRIDGING_HEADER: NodeShiftMusic/Discord/NodeShiftMusic-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
        CLANG_CXX_LIBRARY: libc++
  NodeShiftMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NodeShiftMusicTests
    dependencies:
      - target: NodeShiftMusic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: space.nodeshift.music.tests
schemes:
  NodeShiftMusic:
    build:
      targets:
        NodeShiftMusic: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NodeShiftMusicTests
    archive:
      config: Release
