location = /app {
    return 301 /app/;
}

location /app/ {
    root /var/www/nsm-app;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;
}

location ~ ^/app/files/(ios|win|android)/?$ {
    root /var/www/nsm-app;
    rewrite ^ /app/platform.html break;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;
}

location = /app/files/ios/download {
    alias /var/www/nsm-app/app/bin/ios/NodeShiftMusic.ipa;
    default_type application/octet-stream;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Disposition 'attachment; filename="NodeShiftMusic.ipa"' always;
    add_header Cache-Control "no-cache" always;
}

location = /app/files/android/download {
    alias /var/www/nsm-app/app/bin/android/NodeShiftMusic.apk;
    default_type application/vnd.android.package-archive;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Disposition 'attachment; filename="NodeShiftMusic.apk"' always;
    add_header Cache-Control "no-cache" always;
}

location = /app/files/win/download {
    alias /var/www/nsm-app/app/bin/win/NodeShiftMusic-Setup.exe;
    default_type application/octet-stream;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Disposition 'attachment; filename="NodeShiftMusic-Setup.exe"' always;
    add_header Cache-Control "no-cache" always;
}

location ~ ^/app/update/files/(ios|win|android)/?$ {
    root /var/www/nsm-app;
    rewrite ^/app/update/files/([a-z]+)/?$ /app/update/$1.json break;
    default_type application/json;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;
}

location ~ ^/app/update/files/(ios|win|android)/latest$ {
    return 302 /app/files/$1/download;
}
