name: bump

on:
  push:
    branches: [main]
    paths:
      - bump/**
      - .github/workflows/bump.yml
  pull_request:
    paths:
      - bump/**
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: bump
        run: pip install -r requirements-dev.txt

      - name: Tests
        working-directory: bump
        run: python -m pytest -q
