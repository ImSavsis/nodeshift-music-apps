name: android

on:
  push:
    branches: [main]
    paths:
      - android/**
      - shared/**
      - tools/ci/android-shoot.sh
      - .github/workflows/android.yml
  pull_request:
    paths:
      - android/**
      - shared/**
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14.6

      - name: Core tests
        working-directory: android
        run: gradle :core:test --console=plain

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-test-report
          path: android/core/build/reports/tests

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14.6

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "NSM_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          fi

      - name: Build release
        working-directory: android
        env:
          NSM_BUILD: ${{ github.run_number }}
          NSM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NSM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle :app:assembleRelease --console=plain

      - name: Manifest
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk NodeShiftMusic.apk
          VERSION=$(grep -m1 'versionName' android/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          SIZE=$(stat -c%s NodeShiftMusic.apk)
          SHA=$(sha256sum NodeShiftMusic.apk | cut -d' ' -f1)
          NOTES=$(git log -1 --pretty=%s)
          jq -n \
            --arg version "$VERSION" \
            --argjson build ${{ github.run_number }} \
            --arg commit "$GITHUB_SHA" \
            --argjson size "$SIZE" \
            --arg sha256 "$SHA" \
            --arg notes "$NOTES" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{platform: "android", version: $version, build: $build, commit: $commit, file: "NodeShiftMusic.apk", size: $size, sha256: $sha256, minOS: "8.0", notes: $notes, builtAt: $builtAt}' > update.json
          cat update.json

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: |
            NodeShiftMusic.apk
            update.json

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pixel6
            profile: pixel_6
          - name: nexus5
            profile: Nexus 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: false
          script: bash tools/ci/android-shoot.sh apk/NodeShiftMusic.apk screens

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-screens-${{ matrix.name }}
          path: screens

  publish:
    needs: [core, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: apk

      - name: Publish rolling release
        working-directory: apk
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --prerelease --title "Android rolling" --notes "rolling build from main"
          gh release upload android-latest NodeShiftMusic.apk update.json --clobber
