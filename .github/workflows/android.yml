name: android

on:
  push:
    branches: [main]
    paths:
      - android/**
      - shared/**
      - .github/workflows/android.yml
  pull_request:
    paths:
      - android/**
      - shared/**
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14.6

      - name: Core tests
        working-directory: android
        run: gradle :core:test --console=plain

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-test-report
          path: android/core/build/reports/tests

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14.6

      - name: Build debug
        working-directory: android
        env:
          NSM_BUILD: ${{ github.run_number }}
        run: gradle :app:assembleDebug --console=plain
