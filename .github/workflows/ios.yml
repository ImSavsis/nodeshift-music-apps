name: ios

on:
  push:
    branches: [main]
    paths:
      - ios/**
      - shared/**
      - tools/ci/**
      - .github/workflows/ios.yml
  pull_request:
    paths:
      - ios/**
      - shared/**
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Core tests
        working-directory: ios/Packages/NSMCore
        run: swift test

      - name: XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned
        working-directory: ios
        run: |
          xcodebuild \
            -project NodeShiftMusic.xcodeproj \
            -scheme NodeShiftMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Package ipa
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/NodeShiftMusic.app
          test -d "$APP"
          rm -rf Payload NodeShiftMusic.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry NodeShiftMusic.ipa Payload
          ls -l NodeShiftMusic.ipa

      - name: Manifest
        working-directory: ios
        run: |
          VERSION=$(grep -m1 MARKETING_VERSION project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          SIZE=$(stat -f%z NodeShiftMusic.ipa)
          SHA=$(shasum -a 256 NodeShiftMusic.ipa | cut -d' ' -f1)
          NOTES=$(git log -1 --pretty=%s)
          jq -n \
            --arg version "$VERSION" \
            --argjson build ${{ github.run_number }} \
            --arg commit "$GITHUB_SHA" \
            --argjson size "$SIZE" \
            --arg sha256 "$SHA" \
            --arg notes "$NOTES" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{platform: "ios", version: $version, build: $build, commit: $commit, file: "NodeShiftMusic.ipa", size: $size, sha256: $sha256, minOS: "17.0", notes: $notes, builtAt: $builtAt}' > update.json
          cat update.json

      - uses: actions/upload-artifact@v4
        with:
          name: NodeShiftMusic-ipa
          path: |
            ios/NodeShiftMusic.ipa
            ios/update.json

      - name: Publish rolling release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: ios
        run: |
          gh release view ios-latest >/dev/null 2>&1 || gh release create ios-latest --prerelease --title "iOS rolling" --notes "rolling build from main"
          gh release upload ios-latest NodeShiftMusic.ipa update.json --clobber

  sim:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build for testing
        working-directory: ios
        run: |
          xcodebuild build-for-testing             -project NodeShiftMusic.xcodeproj             -scheme NodeShiftMusic             -configuration Debug             -sdk iphonesimulator             -destination 'platform=iOS Simulator,name=iPhone 17 Pro'             -derivedDataPath build-sim             -clonedSourcePackagesDirPath build-sim/SourcePackages             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             ARCHS=arm64             ONLY_ACTIVE_ARCH=YES

      - name: Unit tests
        id: tests
        continue-on-error: true
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test-without-building             -project NodeShiftMusic.xcodeproj             -scheme NodeShiftMusic             -configuration Debug             -sdk iphonesimulator             -destination 'platform=iOS Simulator,name=iPhone 17 Pro'             -derivedDataPath build-sim             CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../test.log | grep -E "Test Case|error:|failed|passed|Executed|XCTAssert" | tail -n 80

      - name: Screenshots
        timeout-minutes: 25
        run: bash tools/ci/shoot.sh ios/build-sim/Build/Products/Debug-iphonesimulator/NodeShiftMusic.app screens

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim
          path: |
            screens
            test.log

      - name: Fail when tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
